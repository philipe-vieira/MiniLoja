services:
  db:
    image: postgres:17-alpine
    container_name: miniloja-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - miniloja_net

  cache:
    image: redis:7-alpine
    container_name: miniloja-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - miniloja_net

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    container_name: miniloja-back-dev
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ];
      then npm ci; fi && npm run start:dev"
    environment:
      NODE_ENV: ${BACK_NODE_ENV}
      PORT: ${BACK_INTERNAL_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_ENABLED_LEVELS: ${LOG_ENABLED_LEVELS}
      LOG_CONSOLE_ENABLED: ${LOG_CONSOLE_ENABLED}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED}
      LOG_FILE_PATH: ${LOG_FILE_PATH}
      LOG_TIMESTAMP_ENABLED: ${LOG_TIMESTAMP_ENABLED}
      LOG_JSON_ENABLED: ${LOG_JSON_ENABLED}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - back_node_modules:/app/node_modules
    ports:
      - "${BACK_PORT}:${BACK_INTERNAL_PORT}"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/hello').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - miniloja_net

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: miniloja-front-dev
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ];
      then npm ci; fi && npm run dev -- --hostname 0.0.0.0 --port ${FRONT_INTERNAL_PORT}"
    environment:
      NODE_ENV: ${FRONT_NODE_ENV}
      PORT: ${FRONT_INTERNAL_PORT}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
    ports:
      - "${FRONT_PORT}:${FRONT_INTERNAL_PORT}"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000)).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - miniloja_net

  nginx:
    image: nginx:1.27-alpine
    container_name: miniloja-nginx-dev
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      front:
        condition: service_started
      back:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - miniloja_net

volumes:
  db_data:
  redis_data:
  back_node_modules:
  front_node_modules:

networks:
  miniloja_net:
    driver: bridge
